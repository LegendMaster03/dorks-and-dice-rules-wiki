services:
  rules-wiki:
    image: dorks-and-dice-rules-wiki:latest
    build:
      context: .
      dockerfile: src/RulesWiki.Web/Dockerfile
    container_name: dorks-and-dice-rules-wiki
    restart: unless-stopped
    environment:
      ToolHost__BaseUrl: ${TOOL_HOST_BASE_URL:-http://dorks-and-dice-site:8080}
      RulesCorePrivate__BaseUrl: ${RULES_CORE_PRIVATE_BASE_URL:-http://dorks-and-dice-rules-core-private:8080}
    networks:
      - dorks-and-dice-backend

networks:
  dorks-and-dice-backend:
    external: true
