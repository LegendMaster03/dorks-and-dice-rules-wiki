name: Validate Rules Wiki

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ "**" ]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Restore
        run: dotnet restore dorks-and-dice-rules-wiki.slnx
      - name: Full C# test suite including native operation integration
        run: dotnet test dorks-and-dice-rules-wiki.slnx --configuration Release --no-restore
      - name: Browser syntax and native-first contract
        run: |
          set -euo pipefail
          for file in src/RulesWiki.Web/wwwroot/*.js tools/*.mjs; do
            node --input-type=module --check < "$file"
          done
          node tools/validate-native-reference-browser.mjs
          node tools/test-native-reference-api.mjs
      - name: Retain safe Embedded Module rendering lifecycle
        run: |
          if grep -R 'MutationObserver' -n src/RulesWiki.Web/wwwroot; then
            echo "Do not use mutation observers to manage render lifecycle."
            exit 1
          fi
      - name: Test deployment guards
        run: python3 -m unittest discover -s tests -p 'test_deploy_native_wiki.py' -v
      - name: Validate Compose including private tunnel
        env:
          RulesCorePrivate__Network: rules-wiki-rules-core-test
          RULES_WIKI_IMAGE: dorks-and-dice-rules-wiki:test
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.private-tunnel.yml config >/dev/null
      - name: Build container
        run: docker build -t dorks-and-dice-rules-wiki:test -f src/RulesWiki.Web/Dockerfile .
      - name: Smoke test stateless Wiki host
        run: |
          set -euo pipefail
          docker run -d --rm --name dorks-and-dice-rules-wiki-smoketest \
            -p 127.0.0.1:58080:8080 \
            -e ToolHost__BaseUrl=http://site.example.invalid \
            -e RulesCorePrivate__BaseUrl=http://rules-core-private.example.invalid \
            dorks-and-dice-rules-wiki:test
          trap 'docker rm -f dorks-and-dice-rules-wiki-smoketest >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:58080/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:58080/app.js | grep -q mountNativeRulesBrowser
