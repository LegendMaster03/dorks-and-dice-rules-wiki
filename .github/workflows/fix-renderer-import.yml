name: Fix migrated renderer import

on:
  push:
    branches: [ "feature/rules-wiki-split" ]
    paths: [ ".github/workflows/fix-renderer-import.yml" ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rules-wiki-split
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Add missing renderer import
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/RulesWiki.Web/wwwroot/rule-renderers-specialized.js')
          text = path.read_text()
          needle = '    formatCreatureType,\n'
          replacement = '    formatCreatureType,\n    formatChallenge,\n'
          if '    formatChallenge,\n' not in text:
              if needle not in text:
                  raise SystemExit('Expected import insertion point not found.')
              text = text.replace(needle, replacement, 1)
              path.write_text(text)
          PY
          node tools/validate-monster-renderer.mjs
          node tools/validate-structured-rule-renderers.mjs
      - name: Commit renderer fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/RulesWiki.Web/wwwroot/rule-renderers-specialized.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix migrated monster renderer import"
          git push origin HEAD:feature/rules-wiki-split
