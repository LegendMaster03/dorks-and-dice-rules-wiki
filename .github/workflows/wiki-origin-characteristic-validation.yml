name: Workstream D isolated characteristic validation
on:
  pull_request:
    branches: [feature/wiki-character-origins-integration]
    paths:
      - 'src/RulesWiki.Web/wwwroot/native-origin-characteristic.js'
      - 'tools/test-origin-characteristic.mjs'
      - 'tools/fixtures/origin-characteristic/**'
      - '.github/workflows/wiki-origin-characteristic-validation.yml'
permissions:
  contents: read
jobs:
  characteristic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tools/test-origin-characteristic.mjs
