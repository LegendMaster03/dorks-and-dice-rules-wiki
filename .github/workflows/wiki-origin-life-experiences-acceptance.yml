name: Workstream F isolated acceptance
on:
  push:
    branches: [ feature/wiki-origin-life-experiences-reader ]
permissions:
  contents: read
jobs:
  life-experiences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tools/test-life-experiences-reader.mjs --preview-dir /tmp/life-experience-previews
      - uses: actions/upload-artifact@v4
        with:
          name: life-experience-structural-previews
          path: /tmp/life-experience-previews
