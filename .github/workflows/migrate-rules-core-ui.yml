name: Migrate Rules Core UI snapshot

on:
  push:
    branches: [ "feature/rules-wiki-split" ]
    paths: [ ".github/workflows/migrate-rules-core-ui.yml" ]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Rules Wiki
        uses: actions/checkout@v4
        with:
          ref: feature/rules-wiki-split
          fetch-depth: 0

      - name: Check out pinned Rules Core source
        uses: actions/checkout@v4
        with:
          repository: LegendMaster03/dorks-and-dice-rules-core
          ref: 147fb998427b14cce2bdd2157c18a842ed6e421a
          path: .migration/rules-core

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Copy presentation application
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src/RulesWiki.Web/wwwroot tools
          mkdir -p src/RulesWiki.Web/wwwroot tools docs
          cp -a .migration/rules-core/src/RulesCore.Web/wwwroot/. src/RulesWiki.Web/wwwroot/
          cp .migration/rules-core/tools/validate-monster-renderer.mjs tools/
          cp .migration/rules-core/tools/validate-render-lifecycle.mjs tools/
          cp .migration/rules-core/tools/validate-structured-rule-renderers.mjs tools/
          cp .migration/rules-core/tools/validate-workspace-routing.mjs tools/
          cp .migration/rules-core/docs/frontend-render-lifecycle.md docs/
          cp .migration/rules-core/docs/rules-browser.md docs/
          cp .migration/rules-core/docs/ux-guidelines.md docs/

          find src/RulesWiki.Web/wwwroot tools docs -type f -print0 | xargs -0 sed -i \
            -e 's#/tools/rules-core#/tools/rules-wiki#g' \
            -e 's#src/RulesCore.Web/wwwroot#src/RulesWiki.Web/wwwroot#g'

          sed -i \
            -e 's/Rules Core could not find/Rules Wiki could not find/' \
            -e 's/Loading Rules Core/Loading Rules Wiki/' \
            -e 's/Rules Core failed to initialize/Rules Wiki failed to initialize/' \
            -e 's/Rules Core unavailable/Rules Wiki unavailable/' \
            src/RulesWiki.Web/wwwroot/app.js

          sed -i \
            -e 's/Rules Core owns a \*\*tool-relative\*\* route/Rules Wiki owns a **tool-relative** browser route/' \
            docs/rules-browser.md

          cat > docs/migration-provenance.md <<'DOC'
          # UI migration provenance

          The initial Rules Wiki presentation layer was migrated from
          `LegendMaster03/dorks-and-dice-rules-core` at commit
          `147fb998427b14cce2bdd2157c18a842ed6e421a`.

          The migration preserves the existing UI modules, styling, rendering lifecycle,
          routing behavior, and browser-side API client. Only Tool ownership and the
          fallback Tool mount changed from `rules-core` to `rules-wiki`. The `/api/*`
          browser contract is intentionally unchanged and is forwarded server-side to
          Rules Core through Site Tool-to-Tool delegation.
          DOC

          rm -rf .migration

      - name: Validate migrated browser modules
        shell: bash
        run: |
          set -euo pipefail
          for file in src/RulesWiki.Web/wwwroot/*.js tools/*.mjs; do
            node --input-type=module --check < "$file"
          done
          node tools/validate-structured-rule-renderers.mjs
          node tools/validate-render-lifecycle.mjs
          node tools/validate-workspace-routing.mjs
          if grep -R '/tools/rules-core' -n src/RulesWiki.Web/wwwroot tools docs; then
            echo "Rules Wiki presentation still contains the old Tool mount."
            exit 1
          fi

      - name: Test Rules Wiki
        env:
          ToolHost__BaseUrl: http://site.example.invalid
        run: |
          dotnet restore dorks-and-dice-rules-wiki.slnx
          dotnet test dorks-and-dice-rules-wiki.slnx --configuration Release --no-restore
          docker build -t dorks-and-dice-rules-wiki:migration -f src/RulesWiki.Web/Dockerfile .

      - name: Commit migrated snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/migrate-rules-core-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate Rules Core presentation into Rules Wiki"
          git push origin HEAD:feature/rules-wiki-split
