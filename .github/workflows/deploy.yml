name: Deploy Rules Wiki
run-name: Native Wiki at ${{ github.event.workflow_run.head_sha || github.sha }}
on:
  workflow_run:
    workflows: [Validate Rules Wiki]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dorks-and-dice-rules-wiki
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, dorks-and-dice-rules-wiki]
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RULES_WIKI_ENV_FILE: /mnt/HDDs/www/dorks-and-dice-rules-wiki/.env
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Reject a superseded release
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_SHA"
      - name: Require a running native Core before replacing Wiki
        run: python3 tools/deploy_native_wiki.py preflight
      - name: Build commit-pinned Wiki
        run: docker build --label "org.opencontainers.image.revision=$RELEASE_SHA" -t "dorks-and-dice-rules-wiki:rewrite-$RELEASE_SHA" -f src/RulesWiki.Web/Dockerfile .
      - name: Deploy and observe Wiki
        run: python3 tools/deploy_native_wiki.py deploy
