name: Wiki Origins C isolated acceptance
on:
  pull_request:
    branches: [feature/wiki-character-origins-integration]
    paths:
      - 'src/RulesWiki.Web/wwwroot/origin-biological-reader.js'
      - 'tools/test-origin-biological-reader.mjs'
      - '.github/workflows/origin-biological-acceptance.yml'
permissions:
  contents: read
jobs:
  biological-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tools/test-origin-biological-reader.mjs origin-biological-preview
      - uses: actions/upload-artifact@v4
        with:
          name: biological-reference-html-preview
          path: origin-biological-preview/
      - run: npm test
